# Dependabot: weekly dependency updates + grouped security updates.
# Standard config shared by all active easonyen16 repos.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    # Wait before proposing a brand-new release (supply-chain safety; security updates are not delayed)
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    # Conventional Commits: "chore(deps): bump ..." / "chore(deps-dev): bump ..."
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # minor + patch in one PR; major updates stay separate PRs for review
      gomod_minor_patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      gomod_security:
        applies-to: security-updates
        patterns: ["*"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    # Wait before proposing a brand-new release (supply-chain safety; security updates are not delayed)
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    # Conventional Commits: "ci(deps): bump ..."
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github_actions:
        applies-to: version-updates
        patterns: ["*"]
      github_actions_security:
        applies-to: security-updates
        patterns: ["*"]
