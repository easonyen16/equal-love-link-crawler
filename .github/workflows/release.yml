name: Release

on:
  push:
    tags:
      - "v*"

# A newer run for the same branch / PR cancels the one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build all targets
        run: |
          GOOS=windows GOARCH=amd64 go build -o backup-windows-amd64.exe ./cmd/backup
          GOOS=darwin  GOARCH=arm64 go build -o backup-darwin-arm64    ./cmd/backup
          GOOS=linux   GOARCH=amd64 go build -o backup-linux-amd64     ./cmd/backup
          GOOS=linux   GOARCH=arm64 go build -o backup-linux-arm64     ./cmd/backup

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            backup-windows-amd64.exe
            backup-darwin-arm64
            backup-linux-amd64
            backup-linux-arm64
